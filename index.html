<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>مطعم ابن يحيى | المنيو التفاعلي - فول وفلافل ٢٤ ساعة</title>
  <meta name="description" content="المنيو التفاعلي لمطعم ابن يحيى: ساندوتشات الفول والطعمية، وجبات الصالة، طواجن، وتوصيل ٢٤ ساعة. اطلب عبر واتساب.">
  <meta name="theme-color" content="#18110C">
  <link rel="icon" href="images/637885230_1469628955173254_3604443719754401676_n.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="trial" class="trial" hidden>
    <span>🔴 نسخة معاينة · متبقي <b id="cd" dir="ltr">--:--:--</b></span>
    <button onclick="A.paywall(false)">تفعيل المنيو</button>
  </div>

  <header class="hero" id="hero">
    <div class="wrap hero-in">
      <img id="logo" class="logo" alt="لوجو المطعم" onclick="A.secret()">
      <div class="hero-t">
        <h1 id="h-name"></h1>
        <p id="h-slogan"></p>
        <p class="status">🟢 مفتوح · <span id="h-hours"></span></p>
      </div>
      <button class="icon-btn" onclick="A.theme()" aria-label="تغيير المظهر" id="theme-btn">🌙</button>
    </div>
    <div class="wrap quick" id="quick"></div>
  </header>

  <section class="wrap">
    <div class="seg" id="modes"></div>
    <div class="table-row" id="table-row">
      <label for="table-sel">طاولة رقم:</label>
      <select id="table-sel" onchange="A.table(this.value)"></select>
    </div>
  </section>

  <nav class="bar" id="bar">
    <div class="wrap">
      <div class="search">
        <input id="q" type="search" placeholder="ابحث في المنيو..." oninput="A.search(this.value)" autocomplete="off">
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </nav>

  <main class="wrap" id="menu"></main>

  <footer class="wrap foot">
    <p><b id="f-name"></b> · <span id="f-phones" dir="ltr"></span></p>
    <p class="mut">© <span id="f-year"></span> · تصميم وتطوير <span id="f-credit"></span></p>
  </footer>

  <button id="cartbar" class="cartbar" onclick="A.cart()" hidden>
    <span class="cb-n" id="cb-n">0</span>
    <span class="cb-t" id="cb-t">طلبي</span>
    <span class="cb-p" id="cb-p"></span>
  </button>

  <div id="adminbar" class="adminbar" hidden>
    <b>ADMIN</b>
    <button onclick="A.edit(null)">➕ صنف</button>
    <button class="ok" onclick="A.export()">💾 حفظ وتصدير</button>
    <button onclick="A.qr()">QR</button>
    <button onclick="A.exitAdmin()">خروج ✕</button>
  </div>

  <div id="modal" class="modal" onclick="if(event.target===this)A.close()"><div id="sheet" class="sheet"></div></div>
  <div id="toast" class="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <script src="js/config.js"></script>
  <script src="js/menu-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
